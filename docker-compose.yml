name: belong

networks:
  belong-network:

volumes:
  belong-postgres-volume:

services:
  db:
    image: docker.io/postgres:18.4-alpine3.23
    container_name: belong-db
    restart: on-failure
    networks:
      - belong-network
    volumes:
      - belong-postgres-volume:/var/lib/postgresql
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${BELONG_DB_USER}
      POSTGRES_PASSWORD: ${BELONG_DB_PASS}
      POSTGRES_DB: ${BELONG_DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BELONG_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/rodneyosodo/belong-backend:latest
    container_name: belong-backend
    restart: on-failure
    networks:
      - belong-network
    ports:
      - 5090:5090
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BELONG_DB_URI: ${BELONG_DB_URI}
      BELONG_GOOGLE_CLIENT_ID: ${BELONG_GOOGLE_CLIENT_ID}
      BELONG_GOOGLE_CLIENT_SECRET: ${BELONG_GOOGLE_CLIENT_SECRET}
      BELONG_GITHUB_CLIENT_ID: ${BELONG_GITHUB_CLIENT_ID}
      BELONG_GITHUB_CLIENT_SECRET: ${BELONG_GITHUB_CLIENT_SECRET}
      BELONG_FRONTEND_URL: ${BELONG_FRONTEND_URL}
      BELONG_SMTP_HOST: ${BELONG_SMTP_HOST}
      BELONG_SMTP_PORT: ${BELONG_SMTP_PORT}
      BELONG_SMTP_USER: ${BELONG_SMTP_USER}
      BELONG_SMTP_PASS: ${BELONG_SMTP_PASS}
      BELONG_SMTP_FROM: ${BELONG_SMTP_FROM}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ghcr.io/rodneyosodo/belong-web:latest
    container_name: belong-web
    restart: on-failure
    networks:
      - belong-network
    ports:
      - 5091:5091
    environment:
      BELONG_BACKEND_URL: ${BELONG_BACKEND_URL:-http://localhost:5090}
      BELONG_GOOGLE_CLIENT_ID: ${BELONG_GOOGLE_CLIENT_ID:-}
      BELONG_GITHUB_CLIENT_ID: ${BELONG_GITHUB_CLIENT_ID:-}
    depends_on:
      - backend
